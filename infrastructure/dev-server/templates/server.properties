# Pack experiment dev server. install.sh copies this into server/ and fills
# @SEED@ and @GAME_PORT@ (GAME_PORT in infrastructure/project.env).
# online-mode=false: LAN-only test server joined by the offline headless
# client (PexpBot) and the owner's Prism client.
server-port=@GAME_PORT@
server-ip=
online-mode=false
enforce-secure-profile=false
motd=@MOTD@
level-name=world
level-seed=@SEED@
level-type=minecraft\:normal
generate-structures=true
gamemode=survival
difficulty=normal
hardcore=false
pvp=true
allow-flight=true
allow-nether=true
spawn-protection=0
max-players=8
view-distance=10
simulation-distance=8
enable-command-block=true
enable-rcon=false
enable-query=false
enable-status=true
op-permission-level=4
function-permission-level=2
max-tick-time=120000
sync-chunk-writes=true
white-list=false
player-idle-timeout=0
